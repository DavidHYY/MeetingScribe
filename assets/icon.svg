<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!--
    MeetingScribe app icon - master source.

    Concept: a waveform that resolves into lines of text - record -> transcript
    -> minutes in one mark. Three vertical bars (audio) descend tall -> short,
    left to right, then a gap, then three horizontal lines of decreasing length
    (the written minutes). No gradients, no text characters, no emoji.

    Designed at 16x16 first (the binding constraint - this must survive a
    taskbar icon), then scaled up: every coordinate is pixel-snapped to the
    16x16 base grid so edges land on whole device pixels when rasterised at
    16px (no antialiased blur/merge between bars). rx=0.3 on each bar/line is
    invisible at 16px but softens the mark into a pill shape at large sizes.

    The rounded-square tile with a solid background colour and a simple light
    mark works on both light and dark taskbars because the icon carries its
    own opaque background - it does not depend on what is behind it.

    To regenerate the .ico/.png exports after editing this file, see
    tools/generate_icons.py (repo-relative) or README.md "Application icon".
  -->
  <rect x="0" y="0" width="16" height="16" rx="3.2" fill="#1D3557"/>

  <!-- waveform bars: descending tall -> short, left to right = audio settling -->
  <rect x="2" y="2" width="1" height="12" rx="0.3" fill="#FFFFFF"/>
  <rect x="4" y="4" width="1" height="8"  rx="0.3" fill="#FFFFFF"/>
  <rect x="6" y="6" width="1" height="4"  rx="0.3" fill="#FFFFFF"/>

  <!-- text lines: decreasing length = written minutes -->
  <rect x="9" y="3"  width="6" height="2" rx="0.3" fill="#FFFFFF"/>
  <rect x="9" y="7"  width="5" height="2" rx="0.3" fill="#FFFFFF"/>
  <rect x="9" y="11" width="4" height="2" rx="0.3" fill="#FFFFFF"/>
</svg>
